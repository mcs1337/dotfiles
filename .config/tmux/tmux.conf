# ~/.tmux.conf  (or ~/.config/tmux/tmux.conf)
# Starter tmux config for tmux 3.5a
# Reload with: prefix + r   (prefix is Ctrl-a)

# ----------------------------------------------------------------------
# Prefix: Ctrl-a instead of Ctrl-b
# ----------------------------------------------------------------------
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# ----------------------------------------------------------------------
# General
# ----------------------------------------------------------------------
set -g default-terminal "tmux-256color"
set -as terminal-features ",alacritty*:RGB"   # true color
set -g extended-keys on                       # proper modifier keys (Ctrl-Shift-..., etc.)

set -g mouse on
set -g history-limit 50000
set -g escape-time 10          # no delay after Esc (important for Neovim)
set -g focus-events on         # lets Neovim detect focus changes
set -g repeat-time 600
set -g display-time 2000
set -g aggressive-resize on

set -g base-index 1            # windows start at 1
setw -g pane-base-index 1      # panes start at 1
set -g renumber-windows on     # no gaps when closing windows

set -g set-titles on
set -g set-titles-string "#S / #W"

# ----------------------------------------------------------------------
# Keybindings
# ----------------------------------------------------------------------
# Reload config
bind r source-file ~/.tmux.conf \; display-message "Config reloaded"

# Splits (keep the current directory)
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New window in the current directory
bind c new-window -c "#{pane_current_path}"

# Pane navigation (vim-style)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# Pane resizing (repeatable)
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Window navigation
bind -r C-h previous-window
bind -r C-l next-window
bind Tab last-window

# Swap windows left/right
bind -r < swap-window -d -t -1
bind -r > swap-window -d -t +1

# Quick pane zoom is prefix + z (built in)

# ----------------------------------------------------------------------
# Copy mode (vi keys) and clipboard
# ----------------------------------------------------------------------
setw -g mode-keys vi
set -g status-keys vi
set -g set-clipboard on        # also try OSC 52 (works over SSH)

bind Enter copy-mode
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "wl-copy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "wl-copy"

# ----------------------------------------------------------------------
# Appearance (Tokyo Night-ish colors)
# ----------------------------------------------------------------------
set -g status-position bottom
set -g status-interval 5
set -g status-justify left
set -g status-style "bg=#16161e,fg=#a9b1d6"

set -g status-left-length 30
set -g status-left "#[bg=#7aa2f7,fg=#16161e,bold] #S #[bg=#16161e] "

set -g status-right-length 60
set -g status-right "#{?client_prefix,#[bg=#e0af68#,fg=#16161e#,bold] PREFIX #[default] ,}#[fg=#565f89]%a %d %b  #[fg=#a9b1d6]%H:%M "

setw -g window-status-format " #I:#W "
setw -g window-status-style "fg=#565f89"
setw -g window-status-current-format " #I:#W#{?window_zoomed_flag, 󰁌,} "
setw -g window-status-current-style "bg=#292e42,fg=#7dcfff,bold"
setw -g window-status-separator ""

set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

set -g message-style "bg=#292e42,fg=#c0caf5"
set -g mode-style "bg=#33467c,fg=#c0caf5"

# ----------------------------------------------------------------------
# Optional: plugins via TPM (uncomment, then prefix + I to install)
#   git clone https://github.com/tmux-plugins/tpm ~/.tmux/plugins/tpm
# ----------------------------------------------------------------------
# set -g @plugin 'tmux-plugins/tpm'
# set -g @plugin 'tmux-plugins/tmux-resurrect'
# run '~/.tmux/plugins/tpm/tpm'
